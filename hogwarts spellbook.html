<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wand Awaits — The Hogwarts Book of Spells</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=MedievalSharp&display=swap');

:root{
  --night-deep:#05060d;
  --night-mid:#0c1530;
  --night-glow:#233a66;
  --gold:#c9a24d;
  --gold-bright:#f3d98a;
  --parchment:#e9d9ac;
  --parchment-dark:#cdb47f;
  --parchment-shadow:#8a744c;
  --wax:#7e1622;
  --wax-dark:#4c0d16;
  --ink:#2c2013;
  --beam-red:#ff2d3f;
  --beam-glow:#ff8a90;
  --mist:#aab8d6;
}

*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;
  width:100%;min-height:100%;
  background:var(--night-deep);
  color:var(--mist);
  font-family:'EB Garamond',serif;
  overflow-x:hidden;
}

/* ---------- SKY / BACKGROUND ---------- */
#sky{
  position:fixed;inset:0;
  z-index:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 78% 18%, rgba(120,140,190,0.35), transparent 40%),
    linear-gradient(180deg, var(--night-deep) 0%, var(--night-mid) 55%, #16223f 78%, #1c2b4a 100%);
}
.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  opacity:0.6;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.15;}
  50%{opacity:0.95;}
}
.moon{
  position:absolute;
  top:8%;right:12%;
  width:90px;height:90px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff8e0, var(--gold-bright) 55%, #b98f3f 100%);
  box-shadow:0 0 60px 18px rgba(243,217,138,0.35), 0 0 140px 40px rgba(243,217,138,0.12);
  animation:moonGlow 7s ease-in-out infinite;
}
@keyframes moonGlow{
  0%,100%{ box-shadow:0 0 60px 18px rgba(243,217,138,0.32), 0 0 140px 40px rgba(243,217,138,0.10); }
  50%{ box-shadow:0 0 78px 24px rgba(243,217,138,0.5), 0 0 170px 55px rgba(243,217,138,0.18); }
}
.cloud{
  position:absolute;
  border-radius:50%;
  background:rgba(150,165,200,0.10);
  filter:blur(6px);
}
.cloud1{width:340px;height:70px;top:14%;left:-20%;animation:driftA 90s linear infinite;}
.cloud2{width:260px;height:55px;top:26%;left:-30%;animation:driftB 130s linear infinite;}
.cloud3{width:200px;height:45px;top:9%;left:-15%;animation:driftA 70s linear infinite reverse;}
.cloud4{width:460px;height:110px;top:4%;left:-35%;background:rgba(120,135,175,0.16);filter:blur(10px);animation:driftB 150s linear infinite;}
.cloud5{width:300px;height:80px;top:20%;left:-25%;background:rgba(170,182,215,0.08);filter:blur(8px);animation:driftA 105s linear infinite;}
@keyframes driftA{ from{transform:translateX(0);} to{transform:translateX(140vw);} }
@keyframes driftB{ from{transform:translateX(0);} to{transform:translateX(160vw);} }

/* Castle silhouette */
#castle{
  position:absolute;
  bottom:24vh;left:50%;
  transform:translateX(-50%);
  width:min(1100px, 130vw);
  height:auto;
  filter:drop-shadow(0 0 25px rgba(30,20,10,0.6));
}
#castle .stone{ fill:#0a0f1e; }
#castle .window{ fill:var(--gold-bright); opacity:0.85; }
#castle .window.flicker{ animation:flicker 5s ease-in-out infinite; }
@keyframes flicker{
  0%,100%{opacity:0.85;}
  30%{opacity:0.35;}
  45%{opacity:0.9;}
  65%{opacity:0.3;}
  80%{opacity:0.8;}
}

/* Black Lake */
.lake{
  position:absolute;
  left:0;bottom:9vh;
  width:100%;height:17vh;
  overflow:hidden;
  background:linear-gradient(180deg, #0a1830 0%, #060d1c 60%, #04070f 100%);
}
.lake::before{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(100deg, rgba(180,200,230,0.05) 0px, rgba(180,200,230,0.05) 2px, transparent 2px, transparent 14px);
  animation:rippleShift 6s linear infinite;
  mix-blend-mode:overlay;
}
@keyframes rippleShift{
  from{ background-position:0 0; }
  to{ background-position:200px 0; }
}
.moon-glint{
  position:absolute;
  top:0;right:9%;
  width:34px;height:100%;
  background:linear-gradient(180deg, rgba(243,217,138,0.55), rgba(243,217,138,0.08) 70%, transparent);
  filter:blur(2px);
  animation:glintFlicker 3.2s ease-in-out infinite;
  transform:skewX(-4deg);
}
@keyframes glintFlicker{
  0%,100%{opacity:0.55;}
  50%{opacity:0.9;}
}
.castle-reflection{
  position:absolute;
  top:-2vh;left:50%;
  transform:translateX(-50%) scaleY(-1);
  width:min(1100px, 130vw);
  opacity:0.22;
  filter:blur(1.5px);
}
.castle-reflection .stone{ fill:#0a0f1e; }
.castle-reflection .window{ fill:var(--gold-bright); opacity:0.6; }

/* Forbidden Forest */
.forest{
  position:absolute;
  left:0;bottom:0;
  width:100%;height:16vh;
}
.tree-layer{
  position:absolute;
  left:-5%;bottom:0;
  width:110%;height:100%;
  animation:forestSway 9s ease-in-out infinite;
}
.tree-back{
  height:110%;
  bottom:2vh;
  background:#0a1912;
  opacity:0.65;
  clip-path:polygon(0% 100%,0% 45%,4% 62%,8% 30%,12% 58%,16% 22%,20% 52%,24% 28%,28% 60%,32% 34%,36% 64%,40% 26%,44% 55%,48% 20%,52% 50%,56% 32%,60% 62%,64% 24%,68% 56%,72% 30%,76% 58%,80% 20%,84% 54%,88% 32%,92% 60%,96% 28%,100% 50%,100% 100%);
  animation-duration:11s;
}
.tree-front{
  background:#030b07;
  clip-path:polygon(0% 100%,0% 55%,3% 40%,7% 68%,11% 35%,15% 62%,19% 30%,23% 58%,27% 38%,31% 66%,35% 28%,39% 56%,43% 36%,47% 64%,51% 30%,55% 60%,59% 34%,63% 62%,67% 28%,71% 55%,75% 38%,79% 66%,83% 30%,87% 58%,91% 34%,95% 60%,100% 40%,100% 100%);
  animation-duration:7s;
}
@keyframes forestSway{
  0%,100%{ transform:translateX(0); }
  50%{ transform:translateX(1%); }
}

.forest-mist{
  position:absolute;
  left:-20%;
  width:140%;
  height:8vh;
  background:linear-gradient(180deg, transparent, rgba(190,200,220,0.14), transparent);
  filter:blur(5px);
}
.mist-a{ bottom:1vh; animation:mistDriftA 22s ease-in-out infinite; }
.mist-b{ bottom:5vh; height:6vh; opacity:0.7; animation:mistDriftB 30s ease-in-out infinite; }
.mist-c{ bottom:9vh; height:5vh; opacity:0.5; animation:mistDriftA 26s ease-in-out infinite reverse; }
@keyframes mistDriftA{
  0%,100%{ transform:translateX(0); }
  50%{ transform:translateX(8%); }
}
@keyframes mistDriftB{
  0%,100%{ transform:translateX(0); }
  50%{ transform:translateX(-10%); }
}

/* ---------- LAYOUT ---------- */
.wrap{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:6vh 5vw 8vh;
}
.hero{
  text-align:center;
  margin-top:2vh;
}
.eyebrow{
  letter-spacing:0.35em;
  font-family:'Cinzel',serif;
  font-size:0.72rem;
  color:var(--gold);
  text-transform:uppercase;
  opacity:0.85;
}
h1.title{
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(2.4rem, 7vw, 5rem);
  margin:0.3em 0 0.15em;
  color:var(--gold-bright);
  text-shadow:0 0 18px rgba(243,217,138,0.35), 0 0 40px rgba(243,217,138,0.12);
  letter-spacing:0.04em;
}
.tagline{
  font-style:italic;
  font-size:clamp(1rem,2vw,1.25rem);
  color:var(--mist);
  opacity:0.85;
  max-width:520px;
  margin:0 auto;
}

/* Casting stage */
.stage{
  margin-top:6vh;
  width:min(560px, 88vw);
  background:linear-gradient(180deg, rgba(12,21,48,0.55), rgba(5,6,13,0.55));
  border:1px solid rgba(201,162,77,0.35);
  border-radius:14px;
  padding:2.2rem 2rem;
  text-align:center;
  backdrop-filter:blur(3px);
  box-shadow:0 0 0 1px rgba(201,162,77,0.08), 0 20px 60px rgba(0,0,0,0.5);
  position:relative;
}
.status-line{
  min-height:1.6em;
  font-family:'Cinzel',serif;
  font-size:0.95rem;
  letter-spacing:0.06em;
  color:var(--gold-bright);
  margin-bottom:1.4rem;
  opacity:0.9;
}
.status-line.listening{
  animation:pulseText 1.3s ease-in-out infinite;
}
@keyframes pulseText{
  0%,100%{opacity:0.5;}
  50%{opacity:1;}
}

.cast-btn{
  font-family:'Cinzel',serif;
  font-size:1.05rem;
  letter-spacing:0.06em;
  color:var(--night-deep);
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  border:none;
  border-radius:999px;
  padding:0.9rem 2.2rem;
  cursor:pointer;
  box-shadow:0 0 25px rgba(243,217,138,0.35), 0 8px 18px rgba(0,0,0,0.4);
  transition:transform 0.18s ease, box-shadow 0.18s ease;
}
.cast-btn:hover{ transform:translateY(-2px); box-shadow:0 0 34px rgba(243,217,138,0.5), 0 10px 22px rgba(0,0,0,0.45); }
.cast-btn:active{ transform:translateY(0); }
.cast-btn.active{
  animation:micPulse 1.1s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{ box-shadow:0 0 25px rgba(243,217,138,0.35), 0 8px 18px rgba(0,0,0,0.4); }
  50%{ box-shadow:0 0 45px rgba(243,217,138,0.75), 0 8px 18px rgba(0,0,0,0.4); }
}
.cast-btn:disabled{ opacity:0.55; cursor:default; animation:none; }

.fallback{
  margin-top:1.3rem;
  display:flex;
  gap:0.5rem;
  justify-content:center;
  flex-wrap:wrap;
}
.fallback input{
  font-family:'EB Garamond', serif;
  font-size:0.95rem;
  padding:0.55rem 0.9rem;
  border-radius:8px;
  border:1px solid rgba(201,162,77,0.4);
  background:rgba(255,255,255,0.04);
  color:var(--mist);
  min-width:220px;
}
.fallback input::placeholder{ color:rgba(170,184,214,0.5); }
.fallback button{
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  padding:0.55rem 1.1rem;
  border-radius:8px;
  border:1px solid rgba(201,162,77,0.5);
  background:rgba(201,162,77,0.12);
  color:var(--gold-bright);
  cursor:pointer;
}
.fallback button:hover{ background:rgba(201,162,77,0.22); }
.hint{
  margin-top:0.9rem;
  font-size:0.78rem;
  opacity:0.55;
  font-style:italic;
}
/* Spellbook floating button */
.spellbook-btn{
  position:fixed;
  top:4vh;right:4vw;
  z-index:25;
  display:flex;align-items:center;gap:0.5rem;
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  letter-spacing:0.04em;
  color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(12,21,48,0.75), rgba(5,6,13,0.85));
  border:1px solid rgba(201,162,77,0.5);
  border-radius:999px;
  padding:0.65rem 1.1rem;
  cursor:pointer;
  box-shadow:0 0 20px rgba(243,217,138,0.2), 0 8px 18px rgba(0,0,0,0.4);
  transition:transform 0.18s ease, box-shadow 0.18s ease;
}
.spellbook-btn:hover{ transform:translateY(-2px); box-shadow:0 0 30px rgba(243,217,138,0.4), 0 10px 22px rgba(0,0,0,0.45); }
.spellbook-btn .icon{ font-size:1.2rem; }

.spellbook-overlay{
  position:fixed;inset:0;
  z-index:45;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,4,9,0.65);
  backdrop-filter:blur(2px);
  padding:4vh 4vw;
}
.spellbook-overlay.show{ display:flex; }

.spellbook-panel{
  width:min(640px, 92vw);
  max-height:82vh;
  background:linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  border-radius:10px;
  box-shadow:inset 0 0 40px rgba(120,90,40,0.35), 0 20px 60px rgba(0,0,0,0.6);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.spellbook-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.4rem 1.8rem 0.8rem;
  border-bottom:1px solid rgba(120,90,40,0.35);
}
.spellbook-header h2{
  font-family:'MedievalSharp', cursive;
  color:var(--wax);
  margin:0;
  font-size:1.6rem;
}
.close-spellbook{
  background:transparent;
  border:1px solid var(--wax);
  color:var(--wax);
  border-radius:50%;
  width:30px;height:30px;
  cursor:pointer;
  font-size:0.9rem;
  line-height:1;
}
.close-spellbook:hover{ background:rgba(126,22,34,0.1); }

.spellbook-list{
  padding:1.2rem 1.8rem 1.8rem;
  overflow-y:auto;
  color:var(--ink);
}
.spellbook-entry{
  padding:1rem 0;
  border-bottom:1px dashed rgba(120,90,40,0.4);
}
.spellbook-entry:last-child{ border-bottom:none; }
.spellbook-entry h3{
  font-family:'MedievalSharp', cursive;
  font-size:1.25rem;
  color:var(--wax);
  margin:0 0 0.4rem;
}
.spellbook-entry p{
  font-family:'EB Garamond', serif;
  font-size:1.02rem;
  line-height:1.55;
  margin:0;
}

footer{
  margin-top:auto;
  padding-top:5vh;
  font-size:0.75rem;
  opacity:0.4;
  text-align:center;
}

/* ---------- FX LAYER ---------- */
#fx-layer{
  position:fixed;inset:0;
  z-index:30;
  pointer-events:none;
  overflow:hidden;
}
.fx-obj{
  position:absolute;
  font-size:2rem;
  filter:drop-shadow(0 0 8px rgba(243,217,138,0.5));
  will-change:transform, opacity;
}
.float-up{
  animation:floatUp 2.6s ease-in forwards;
}
@keyframes floatUp{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  70%{ opacity:1; }
  100%{ transform:translateY(-70vh) rotate(18deg); opacity:0; }
}
.fly-center{
  animation:flyCenter 1.1s cubic-bezier(.55,0,.85,.35) forwards;
}
@keyframes flyCenter{
  0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  85%{ opacity:1; }
  100%{ transform:translate(var(--dx), var(--dy)) scale(0.15) rotate(25deg); opacity:0; }
}

.beam{
  position:absolute;
  top:38%;
  left:-20%;
  width:140%;
  height:6px;
  background:linear-gradient(90deg, transparent, var(--beam-red) 20%, var(--beam-glow) 50%, var(--beam-red) 80%, transparent);
  box-shadow:0 0 18px 6px rgba(255,45,63,0.85), 0 0 50px 16px rgba(255,45,63,0.35);
  transform:rotate(-6deg) scaleX(0);
  transform-origin:left center;
  animation:shootBeam 0.65s ease-out forwards;
}
@keyframes shootBeam{
  0%{ transform:rotate(-6deg) scaleX(0); opacity:1;}
  70%{ transform:rotate(-6deg) scaleX(1); opacity:1;}
  100%{ transform:rotate(-6deg) scaleX(1); opacity:0;}
}
.spark{
  position:absolute;
  top:36%;
  left:78%;
  width:40px;height:40px;
  border-radius:50%;
  background:radial-gradient(circle, #fff, var(--beam-glow) 40%, var(--beam-red) 70%, transparent 75%);
  animation:sparkBurst 0.7s ease-out forwards;
  animation-delay:0.5s;
  opacity:0;
}
@keyframes sparkBurst{
  0%{ transform:scale(0.2); opacity:0; }
  30%{ opacity:1; }
  100%{ transform:scale(3.2); opacity:0; }
}

.fx-spark{
  position:absolute;
  width:9px;height:9px;
  border-radius:50%;
  background:var(--c, #f3d98a);
  box-shadow:0 0 12px 4px var(--c, #f3d98a);
  animation:sparkBurstOut 1.15s ease-out forwards;
}
@keyframes sparkBurstOut{
  0%{ transform:translate(0,0) scale(0.5); opacity:1; }
  65%{ opacity:1; }
  100%{ transform:translate(var(--dx), var(--dy)) scale(0.1); opacity:0; }
}

/* Owl */
.owl{
  position:absolute;
  font-size:2.6rem;
  left:-10vw;
  top:70vh;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  animation:owlFlight 3.2s cubic-bezier(.45,.05,.55,.95) forwards;
}
@keyframes owlFlight{
  0%{   left:-10vw; top:72vh; transform:scale(0.9) rotate(-6deg); }
  35%{  left:38vw;  top:22vh; transform:scale(0.7) rotate(4deg); }
  55%{  left:58vw;  top:16vh; transform:scale(0.65) rotate(-2deg); }
  80%{  left:52vw;  top:52vh; transform:scale(1) rotate(6deg); }
  100%{ left:50vw;  top:60vh; transform:scale(1.05) rotate(0deg); }
}
.owl.reverse-wing{ display:inline-block; transform:scaleX(-1); }

.parchment-drop{
  position:absolute;
  font-size:1.6rem;
  left:50vw;top:60vh;
  animation:dropScroll 0.9s ease-in forwards;
  animation-delay:2.9s;
  opacity:0;
}
@keyframes dropScroll{
  0%{ opacity:0; transform:translateY(-6vh) rotate(0deg);}
  20%{ opacity:1;}
  100%{ opacity:1; transform:translateY(18vh) rotate(25deg);}
}

/* ---------- PARCHMENT MODAL ---------- */
#parchment-overlay{
  position:fixed;inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,4,9,0.65);
  backdrop-filter:blur(2px);
}
#parchment-overlay.show{ display:flex; }

.scroll-wrap{
  position:relative;
  width:min(560px, 90vw);
  display:flex;
  flex-direction:column;
  align-items:center;
}
.rod{
  width:100%;
  height:20px;
  border-radius:10px;
  background:linear-gradient(180deg, #d8b25a, #8a6423);
  box-shadow:inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 8px rgba(0,0,0,0.5);
  position:relative;
  z-index:2;
}
.rod::before, .rod::after{
  content:'';
  position:absolute;
  top:-4px;
  width:16px;height:28px;
  border-radius:8px;
  background:linear-gradient(180deg, #e8c874, #8a6423);
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
}
.rod::before{ left:-8px; }
.rod::after{ right:-8px; }

.parchment-sheet{
  width:100%;
  height:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at top left, rgba(255,255,255,0.15), transparent 60%),
    linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  box-shadow:inset 0 0 40px rgba(120,90,40,0.35), 0 10px 30px rgba(0,0,0,0.55);
  transition:height 1.1s cubic-bezier(.25,.9,.35,1);
  position:relative;
  z-index:1;
}
.scroll-wrap.unrolled .parchment-sheet{
  height:min(62vh, 520px);
}
.parchment-inner{
  padding:2.2rem 2.4rem 2.6rem;
  color:var(--ink);
  opacity:0;
  transition:opacity 0.6s ease 0.7s;
  height:100%;
  overflow-y:auto;
}
.scroll-wrap.text-visible .parchment-inner{ opacity:1; }

.spell-name{
  font-family:'MedievalSharp', cursive;
  font-size:1.9rem;
  text-align:center;
  color:var(--wax);
  margin:0 0 0.9rem;
  letter-spacing:0.03em;
}
.spell-desc{
  font-family:'EB Garamond', serif;
  font-size:1.12rem;
  line-height:1.65;
  text-align:left;
}
.close-scroll{
  margin-top:1.3rem;
  display:block;
  margin-left:auto;
  margin-right:auto;
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  letter-spacing:0.04em;
  padding:0.5rem 1.3rem;
  border-radius:999px;
  border:1px solid var(--wax);
  background:transparent;
  color:var(--wax);
  cursor:pointer;
}
.close-scroll:hover{ background:rgba(126,22,34,0.1); }

.wax-seal{
  position:absolute;
  z-index:3;
  top:calc(50% - 34px);
  left:calc(50% - 34px);
  width:68px;height:68px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #a8303f, var(--wax) 55%, var(--wax-dark) 100%);
  box-shadow:0 4px 10px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative', serif;
  color:rgba(255,230,200,0.85);
  font-size:1.5rem;
  opacity:1;
  transition:transform 0.5s ease, opacity 0.5s ease;
}
.scroll-wrap.seal-broken .wax-seal{
  transform:scale(1.3) rotate(12deg);
  opacity:0;
}
.wax-seal::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    linear-gradient(115deg, transparent 46%, rgba(0,0,0,0.55) 48%, transparent 50%),
    linear-gradient(25deg, transparent 60%, rgba(0,0,0,0.5) 62%, transparent 64%);

}

const statusEl = document.getElementById('status');
const castBtn = document.getElementById('castBtn');
const micHint = document.getElementById('micHint');
const fxLayer = document.getElementById('fx-layer');
const typedInput = document.getElementById('typedSpell');
const typedBtn = document.getElementById('typedCastBtn');

let busy = false;

/* ---------------- SPEECH RECOGNITION ---------------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    statusEl.textContent = '🎙 Listening…';
    statusEl.classList.add('listening');
    castBtn.classList.add('active');
  };

  recognition.onerror = (e) => {
    statusEl.classList.remove('listening');
    castBtn.classList.remove('active');
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      statusEl.textContent = 'Microphone access denied — try typing your incantation.';
    } else if(e.error === 'no-speech'){
      statusEl.textContent = 'No incantation heard. Try again.';
    } else {
      statusEl.textContent = 'The charm did not take. Try again.';
    }
  };

  recognition.onend = () => {
    statusEl.classList.remove('listening');
    castBtn.classList.remove('active');
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.toLowerCase();
    handleIncantation(transcript);
  };

  micHint.textContent = 'Grant microphone access, then speak clearly.';
} else {
  micHint.textContent = 'Voice recognition isn\'t supported in this browser — type your incantation instead.';
  castBtn.disabled = true;
  castBtn.textContent = '⚡ Voice unavailable';
}

castBtn.addEventListener('click', () => {
  if(busy || !recognition) return;
  try{ recognition.start(); } catch(e){ /* already started */ }
});

typedBtn.addEventListener('click', () => {
  if(busy) return;
  const val = typedInput.value.trim().toLowerCase();
  if(val) handleIncantation(val);
});
typedInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ typedBtn.click(); }
});

function handleIncantation(transcript){
  const clean = transcript.replace(/[^a-z\s-]/g,'');
  let matched = null;
  for(const key in SPELLS){
    if(SPELLS[key].match(clean)){ matched = key; break; }
  }
  if(!matched){
    statusEl.textContent = `"${transcript}" is not a charm known to this hall.`;
    return;
  }
  castSpell(matched);
}

/* ---------------- SPELL CASTING SEQUENCE ---------------- */
function castSpell(key){
  busy = true;
  castBtn.disabled = true;
  const spell = SPELLS[key];
  statusEl.textContent = `Casting: ${spell.name} …`;

  playEffect(key);

  // owl flies in after the spell effect plays out
  setTimeout(() => {
    flyOwl(() => {
      showParchment(key);
      busy = false;
      castBtn.disabled = false;
    });
  }, 1900);
}

function playEffect(key){
  if(key === 'wingardium') effectLeviosa();
  else if(key === 'expelliarmus') effectExpelliarmus();
  else if(key === 'accio') effectAccio();
  else effectGenericBurst(SPELLS[key].fxColor || '#f3d98a');
}

function effectGenericBurst(color){
  const centerX = 50, centerY = 55;
  for(let i=0;i<16;i++){
    const el = document.createElement('div');
    el.className = 'fx-spark';
    el.style.setProperty('--c', color);
    const angle = Math.random()*Math.PI*2;
    const dist = 20 + Math.random()*18;
    el.style.setProperty('--dx', (Math.cos(angle)*dist)+'vw');
    el.style.setProperty('--dy', (Math.sin(angle)*dist*0.6)+'vh');
    el.style.left = centerX+'vw';
    el.style.top = centerY+'vh';
    el.style.animationDelay = (Math.random()*0.2)+'s';
    fxLayer.appendChild(el);
    setTimeout(()=> el.remove(), 1500);
  }
}

function effectLeviosa(){
  const items = ['🪨','🪶','🕯️','🪨','🪶'];
  items.forEach((icon, i)=>{
    const el = document.createElement('div');
    el.className = 'fx-obj float-up';
    el.textContent = icon;
    el.style.left = (30 + i*10 + Math.random()*6) + 'vw';
    el.style.top = (78 - Math.random()*6) + 'vh';
    el.style.animationDelay = (i*0.15)+'s';
    fxLayer.appendChild(el);
    setTimeout(()=> el.remove(), 3200);
  });
}

function effectExpelliarmus(){
  const beam = document.createElement('div');
  beam.className = 'beam';
  fxLayer.appendChild(beam);
  const spark = document.createElement('div');
  spark.className = 'spark';
  fxLayer.appendChild(spark);
  setTimeout(()=>{ beam.remove(); spark.remove(); }, 1500);
}

function effectAccio(){
  const items = ['🪨','🪶','🕯️','📜','🔮'];
  items.forEach((icon,i)=>{
    const el = document.createElement('div');
    el.className = 'fx-obj';
    el.textContent = icon;
    const angle = (i/items.length) * Math.PI*2;
    const radius = 38;
    const startX = 50 + Math.cos(angle)*radius;
    const startY = 50 + Math.sin(angle)*radius;
    el.style.left = startX+'vw';
    el.style.top = startY+'vh';
    const dx = (50-startX) + 'vw';
    const dy = (50-startY) + 'vh';
    el.style.setProperty('--dx', dx);
    el.style.setProperty('--dy', dy);
    el.classList.add('fly-center');
    el.style.animationDelay = (i*0.08)+'s';
    fxLayer.appendChild(el);
    setTimeout(()=> el.remove(), 1600);
  });
}

/* ---------------- OWL DELIVERY ---------------- */
function flyOwl(onDone){
  statusEl.textContent = 'An owl takes wing from the Owlery…';
  const owl = document.createElement('div');
  owl.className = 'owl';
  owl.textContent = '🦉';
  fxLayer.appendChild(owl);

  const drop = document.createElement('div');
  drop.className = 'parchment-drop';
  drop.textContent = '📜';
  fxLayer.appendChild(drop);

  setTimeout(()=>{
    owl.remove();
    drop.remove();
    onDone();
  }, 3900);
}

/* ---------------- PARCHMENT REVEAL ---------------- */
const overlay = document.getElementById('parchment-overlay');
const scrollWrap = document.getElementById('scrollWrap');
const spellNameEl = document.getElementById('spellName');
const spellDescEl = document.getElementById('spellDesc');
const waxSeal = document.getElementById('waxSeal');
const closeScroll = document.getElementById('closeScroll');

function showParchment(key){
  const spell = SPELLS[key];
  spellNameEl.textContent = spell.name;
  spellDescEl.textContent = spell.desc;

  scrollWrap.classList.remove('unrolled','seal-broken','cracking','text-visible');
  overlay.classList.add('show');
  statusEl.textContent = 'A parchment arrives, sealed in wax…';

  // unroll
  requestAnimationFrame(()=>{
    setTimeout(()=> scrollWrap.classList.add('unrolled'), 60);
  });

  // crack the seal
  setTimeout(()=> scrollWrap.classList.add('cracking'), 1300);
  // break the seal
  setTimeout(()=>{
    scrollWrap.classList.add('seal-broken');
    scrollWrap.classList.add('text-visible');
    statusEl.textContent = `The seal breaks — ${spell.name} revealed.`;
  }, 1750);
}

closeScroll.addEventListener('click', ()=>{
  overlay.classList.remove('show');
  statusEl.textContent = 'Awaiting your incantation…';
  typedInput.value = '';
});
overlay.addEventListener('click', (e)=>{
  if(e.target === overlay){ closeScroll.click(); }
});

/* ---------------- SPELLBOOK ---------------- */
const spellbookBtn = document.getElementById('spellbookBtn');
const spellbookOverlay = document.getElementById('spellbookOverlay');
const closeSpellbookBtn = document.getElementById('closeSpellbookBtn');
const spellbookList = document.getElementById('spellbookList');

Object.values(SPELLS).forEach(spell=>{
  const entry = document.createElement('div');
  entry.className = 'spellbook-entry';
  const h3 = document.createElement('h3');
  h3.textContent = spell.name;
  const p = document.createElement('p');
  p.textContent = spell.desc;
  entry.appendChild(h3);
  entry.appendChild(p);
  spellbookList.appendChild(entry);
});

spellbookBtn.addEventListener('click', ()=> spellbookOverlay.classList.add('show'));
closeSpellbookBtn.addEventListener('click', ()=> spellbookOverlay.classList.remove('show'));
spellbookOverlay.addEventListener('click', (e)=>{
  if(e.target === spellbookOverlay){ spellbookOverlay.classList.remove('show'); }
});
</script>
</body>
</html>
